<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Guita</title>

  <meta
    name="description"
    content="Registrá tus gastos en segundos."
  >

  <meta
    name="theme-color"
    content="#f3f3f0"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="css/app.css"
  >


  <!-- OPEN GRAPH -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="Guita"
  >

  <meta
    property="og:description"
    content="Registrá tus gastos en segundos."
  >

  <meta
    property="og:image"
    content="assets/social/guita-share.jpg"
  >

</head>


<body>

  <main class="app">


    <!-- HEADER -->

    <header>

      <p class="eyebrow">
        CONTROL PERSONAL
      </p>

      <h1>
        Guita
      </h1>

    </header>


    <!-- TOTAL HOY -->

    <section class="resumen">

      <span>
        HOY
      </span>

      <strong id="totalHoy">
        $ 0
      </strong>

    </section>


    <!-- ENTRADA MANUAL -->

    <section class="entrada">

      <label for="gastoInput">
        ¿Qué gastó?
      </label>

      <input
        id="gastoInput"
        type="text"
        inputmode="text"
        autocomplete="off"
        placeholder="100.000 shell"
      >

      <p class="ayuda">
        Ej.: 100000 shell · 35000 coto ayer · 45k ypf
      </p>


      <button
        id="guardarBtn"
        type="button"
      >
        GUARDAR
      </button>


      <!-- FOTO TICKET -->

      <button
        id="ticketBtn"
        class="ticket-btn"
        type="button"
      >
        📷 FOTO TICKET
      </button>


      <input
        id="ticketInput"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
      >


      <!-- PREVIEW -->

      <section
        id="ticketPreview"
        class="ticket-preview"
        hidden
      >

        <div class="ticket-preview-header">

          <span>
            TICKET
          </span>

          <button
            id="cerrarTicketBtn"
            type="button"
            aria-label="Cerrar ticket"
          >
            ×
          </button>

        </div>


        <img
          id="ticketImagen"
          alt="Foto del ticket"
        >


        <button
          id="procesarTicketBtn"
          type="button"
        >
          LEER TICKET
        </button>

      </section>


      <!-- REVISIÓN OCR -->

      <section
        id="ticketRevision"
        class="ticket-revision"
        hidden
      >

        <div class="revision-titulo">

          <span>
            REVISAR GASTO
          </span>

          <span class="revision-badge">
            OCR
          </span>

        </div>


        <div class="revision-campo">

          <label for="ticketComercio">
            Comercio
          </label>

          <input
            id="ticketComercio"
            type="text"
            autocomplete="off"
          >

        </div>


        <div class="revision-campo">

          <label for="ticketMonto">
            Monto
          </label>

          <input
            id="ticketMonto"
            type="number"
            inputmode="decimal"
            min="0"
            step="0.01"
          >

        </div>


        <div class="revision-campo">

          <label for="ticketFecha">
            Fecha
          </label>

          <input
            id="ticketFecha"
            type="date"
          >

        </div>


        <div class="revision-campo">

          <label for="ticketCategoria">
            Categoría
          </label>

          <select id="ticketCategoria">

            <option value="combustible">
              Combustible
            </option>

            <option value="supermercado">
              Supermercado
            </option>

            <option value="farmacia">
              Farmacia
            </option>

            <option value="comida">
              Comida
            </option>

            <option value="sin categoría">
              Sin categoría
            </option>

          </select>

        </div>


        <button
          id="confirmarTicketBtn"
          type="button"
        >
          CONFIRMAR GASTO
        </button>

      </section>


      <p
        id="mensaje"
        class="mensaje"
        aria-live="polite"
      ></p>

    </section>


    <!-- HISTORIAL -->

    <section class="historial">

      <div class="historial-header">

        <h2>
          Movimientos
        </h2>

        <span id="cantidadGastos">
          0
        </span>

      </div>


      <div id="listaGastos"></div>

    </section>


  </main>


  <!-- OCR -->

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


  <!-- GUITA -->

  <script src="js/categories.js"></script>

  <script src="js/parser.js"></script>

  <script src="js/storage.js"></script>

  <script src="js/ticket-parser.js"></script>

  <script src="js/app.js"></script>


  <!-- SERVICE WORKER -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")
            .catch(
              error =>
                console.error(
                  "Service Worker:",
                  error
                )
            );

        }
      );

    }

  </script>

</body>

</html>
